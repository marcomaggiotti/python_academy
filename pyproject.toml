[project]
name = "python-academy"
version = "0.1.0"
description = "Intermediate-to-advanced Python study and practice track"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
pythonpath = ["."]
testpaths = ["modules", "projects"]
